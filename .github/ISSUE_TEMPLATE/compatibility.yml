name: Codex compatibility change
description: Report a documented Codex behavior change
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: input
    id: source
    attributes:
      label: Official documentation link
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex version
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: Use a fictional minimal example only.
    validations:
      required: true
